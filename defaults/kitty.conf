startup_session zellij.session

# Window padding (in pixels)
window_padding_width 8 7

# Disable window decorations
hide_window_decorations yes

# Set window opacity (0.0 to 1.0)
background_opacity 0.98

# Free cmd+k / cmd+shift+k so herdr can use them to cycle workspaces.
# Kitty binds cmd+k to clear_terminal by default and would swallow the chord.
map cmd+k no_op
map cmd+shift+k no_op
